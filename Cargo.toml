[package]
name = "sleepapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "An Axum devtool for simulating slow HTTP responses with different waiting strategies"
license = "MIT"
repository = "https://github.com/givtaj/sleepapi"
readme = "README.md"
keywords = ["http", "simulation", "latency", "axum", "tokio"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
