name: Container images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build (for example v0.1.1-alpha.4)
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/container-images.yml'
      - 'scripts/container-release.py'
      - 'scripts/test_container_release.py'
      - 'Dockerfile'
      - '.dockerignore'

permissions:
  contents: read
  actions: read

concurrency:
  group: container-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/givtaj/sleepapi

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release guard regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_container_release.py' -v
      - name: Resolve release and require successful source CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container-release.py prepare

  build:
    name: Build and test / ${{ matrix.arch }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      ARCH: ${{ matrix.arch }}
      STAGING: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out exact image source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Match Cargo version to the release
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path('source/Cargo.toml').read_text())['package']
          assert package['name'] == 'sleepapi' and package['version'] == os.environ['VERSION']
          PY
      - name: Build native image with source identity
        run: |
          docker build --pull --platform "linux/$ARCH" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag sleepapi:release source
      - name: Test the exact image before pushing
        run: python3 scripts/docker-smoke.py sleepapi:release
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push tested image to a unique staging tag
        if: needs.prepare.outputs.publish == 'true'
        run: |
          docker tag sleepapi:release "$IMAGE:$STAGING"
          docker push "$IMAGE:$STAGING"
          python3 scripts/container-release.py record --reference "$IMAGE:$STAGING" \
            --version "$VERSION" --sha "$SOURCE_SHA" --arch "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: release-digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    name: Publish version manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Check public access and publish a new version only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: python3 scripts/container-release.py promote --version "$VERSION" --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-release
          path: container-release.json
          if-no-files-found: error

  verify:
    name: Anonymous pull and smoke / ${{ matrix.arch }}
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pull without registry credentials and verify identity
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-anonymous"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          docker pull --platform "linux/$ARCH" "$IMAGE:$VERSION"
          python3 scripts/container-release.py verify --reference "$IMAGE:$VERSION" \
            --version "$VERSION" --sha "$SOURCE_SHA" --arch "$ARCH" --digest "$DIGEST"
      - name: Exercise the publicly downloaded image
        run: |
          python3 scripts/docker-smoke.py "$IMAGE@$DIGEST"
          printf 'Verified anonymous pull and HTTP/shutdown smoke on linux/%s for `%s@%s`.\n' \
            "$ARCH" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
